version: 2

models:
  - name: slv_person
    description: >
        Conformed identity spine of the AdventureWorks party model. One row per person
        (19,972, equal to PERSON.PERSON). Mints the person_key that every team's gold person
        dimension inherits, settles the one agreed name form, states in four flags why each
        person exists in the database, resolves one primary email, phone and address per
        person, and shreds the IndividualSurvey XML for the retail customers who answered it.
        Teams project this into their own vocabulary in gold; nobody recomputes person_key.

        CONTAINS PII (names, email, phone) AND SENSITIVE SELF-REPORTED ATTRIBUTES
        (survey_gender, survey_marital_status, survey_age_band, survey_yearly_income).
        Gold models should select only the blocks they need; the survey_* columns are
        candidates for Snowflake column masking policies.

    config:
      # Published to other projects deliberately at MODEL level rather than by adding
      # +access/+group to the silver block in dbt_project.yml. A project-level
      # +access: public would publish every future silver model by default, including
      # internal staging steps. This way publication is one explicit decision per model.
      access: public
      group: it_adventure_works

      # PRIMARY KEY over person_key, applied as DDL after the table is built.
      # Same reasoning as dim_date: a `constraints:` block is only emitted when the model
      # declares `contract: enforced: true`, so without one the key never reaches Snowflake.
      #
      # Safe to re-run only because this is materialized as a table -- every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this model
      # is ever switched to incremental, the second run fails on a duplicate constraint name.
      #
      # Snowflake records it NOT ENFORCED and never validates it on write, so it does not
      # replace the unique and not_null tests below -- those are what actually catch a
      # duplicate person. What it buys: optimizer join elimination, and BI tools and
      # semantic views reading it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_slv_person PRIMARY KEY (person_key)"

    columns:

      # --- keys ----------------------------------------------------------
      - name: person_key
        description: >
            PK. Conformed surrogate key, md5 of business_entity_id, MINTED HERE. Downstream
            projects inherit this column; recomputing it per team risks the same human getting
            different keys in Purchasing and Sales, which silently breaks drill-across.
        data_tests:
          - unique
          - not_null

      - name: business_entity_id
        description: >
            Natural key. The party identifier shared across PERSON, HUMANRESOURCES, SALES and
            PURCHASING -- the same value identifies this party as a person, an employee and a
            salesperson down a supertype chain. Kept under its source name deliberately;
            renaming it per table obscures that it is one identity, not a lookup FK.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id

      # --- identity ------------------------------------------------------
      - name: person_type
        description: >
            Source role label: IN individual customer, SC store contact, GC general contact,
            EM employee, VC vendor contact, SP sales person. A HINT ONLY. Employees are split
            across EM (273) and SP (17), so filtering person_type = 'EM' silently drops the 17
            salespeople, who own every sales quota. Use the is_* flags for any logic.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["IN", "SC", "GC", "EM", "VC", "SP"]

      - name: person_title
        description: "Courtesy title such as Mr. or Ms. Null for most rows."

      - name: person_first_name
        description: "Given name."
        config:
          meta: { contains_pii: true }

      - name: person_middle_name
        description: "Middle name or initial. Null for roughly half of all persons."
        config:
          meta: { contains_pii: true }

      - name: person_last_name
        description: "Family name."
        data_tests: [not_null]
        config:
          meta: { contains_pii: true }

      - name: person_suffix
        description: "Name suffix such as Jr. or III. Null for almost all rows."

      - name: person_full_name
        description: >
            Display name, assembled in the order indicated by the source name_style flag.
            The one agreed name form; gold models should not rebuild this from the parts.
        data_tests: [not_null]
        config:
          meta: { contains_pii: true }

      - name: person_sort_name
        description: "Last name, comma, first name. For display ordering."
        config:
          meta: { contains_pii: true }

      - name: person_is_eastern_name_order
        description: >
            True when the name follows Eastern order with the family name first, from the
            source name_style flag. Every shipped row is currently false, but the logic honours
            the flag rather than hardcoding Western order.

      - name: person_email_promotion
        description: >
            Marketing contact preference: 0 do not send promotions, 1 AdventureWorks only,
            2 AdventureWorks and selected partners.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false

      # --- role flags: why this person is in the database -----------------
      # NOT mutually exclusive. The 17 salespeople are also employees, which is exactly
      # why these are four booleans and not one role column -- person_type already tried
      # that and it is the bug described above.
      - name: is_employee
        description: "Present in HUMANRESOURCES.EMPLOYEE. True for salespeople too. Expect 290."
        data_tests: [not_null]

      - name: is_customer
        description: "True when the person is a RETAIL individual customer — present in
          Sales.Customer with store_id NULL. Expect 18,484, which is exactly
          the surveyed population: only retail customers answered the
          IndividualSurvey, so is_customer and has_demographics_survey agree
          row for row. Persons named as the contact on a RESELLER customer
          account (store_id NOT NULL) are deliberately EXCLUDED here and are
          exposed via is_store_contact instead; all 635 of them carry that
          flag, so nothing is lost. Do not derive retail customers from
          Sales.Customer.person_id alone — store_id is the discriminator."

      - name: is_store_contact
        description: >
            Named contact for a reseller, via BUSINESS_ENTITY_CONTACT joined to SALES.STORE.
            Expect roughly 753.
        data_tests: [not_null]

      - name: is_vendor_contact
        description: >
            Named contact for a supplier, via BUSINESS_ENTITY_CONTACT joined to
            PURCHASING.VENDOR. Expect roughly 156.
        data_tests: [not_null]

      # --- resolved contact ----------------------------------------------
      # email, phone and address are all 1:N in the source. The tie-breaks that pick a
      # winner are business rules, defined once here so six gold dimensions cannot ship
      # six different answers to "which phone is the phone".
      - name: primary_email_address
        description: "Winning email address: lowest email_address_id."
        config:
          meta: { contains_pii: true }

      - name: email_count
        description: >
            Total email addresses held for this person. Greater than 1 means
            primary_email_address is a choice rather than the only value.
        data_tests: [not_null]

      - name: primary_phone_number
        description: "Winning phone number: cell beats work beats home."
        config:
          meta: { contains_pii: true }

      - name: primary_phone_number_type_id
        description: "Type of the winning phone: 1 cell, 2 home, 3 work. Decoded in gold."

      - name: phone_count
        description: "Total phone numbers held for this person."
        data_tests: [not_null]

      - name: primary_address_id
        description: >
            FK to the address model for the winning address, where Home beats Primary beats
            Main Office, then lowest address_id. Null for the few hundred persons with no
            address at all. Gold joins this for city, state and country rather than having
            geography duplicated here.

      - name: primary_address_type_id
        description: "Address type of the winning address."

      - name: address_count
        description: "Total addresses held for this person. Zero is legitimate, not a defect."
        data_tests: [not_null]

      # --- survey: IndividualSurvey XML, retail customers only ------------
      - name: has_demographics_survey
        description: >
            True when the IndividualSurvey XML holds real answers rather than the constant
            163 character empty shell that every non-customer carries. Expect roughly 18,484.
            Use this to tell "never surveyed" apart from "surveyed and the answer was null":
            every survey_ column below is null for the roughly 1,488 persons never surveyed.
        data_tests: [not_null]

      - name: survey_total_purchase_ytd
        description: "Self-reported purchases year to date. A survey answer, not a ledger figure."

      - name: survey_date_first_purchase
        description: "Self-reported date of first purchase."

      - name: survey_gender
        description: "Self-reported gender. SENSITIVE. Customers only."
        config:
          meta: { contains_pii: true }
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "F"]
              config:
                where: "has_demographics_survey"

      - name: survey_marital_status
        description: "Self-reported marital status, M married or S single. SENSITIVE. Customers only."
        config:
          meta: { contains_pii: true }
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "S"]
              config:
                where: "has_demographics_survey"

      - name: survey_age_band
        description: >
            Banded age derived from the survey birth date. The raw birth date is deliberately
            not exposed. Recomputed at build time against CURRENT_DATE, so it drifts until the
            model is rebuilt. SENSITIVE.
        config:
          meta: { contains_pii: true }

      - name: survey_yearly_income
        description: >
            Income BAND as text, for example 50001-75000. Never cast to numeric.
            SENSITIVE.
        config:
          meta: { contains_pii: true }

      - name: survey_yearly_income_sort
        description: >
            Display order for survey_yearly_income, 1 to 5. A null here alongside a non-null
            band flags a source value the CASE does not map.

      - name: survey_education
        description: "Highest education band reached, from Partial High School to Graduate Degree."

      - name: survey_education_sort
        description: >
            Display order for survey_education, 1 to 5. A null alongside a non-null band flags
            an unmapped source value.

      - name: survey_commute_distance
        description: "Commute BAND as text, for example 5-10 Miles. Never cast to numeric."

      - name: survey_commute_distance_sort
        description: >
            Display order for survey_commute_distance, 1 to 5. A null alongside a non-null
            band flags an unmapped source value.

      - name: survey_occupation
        description: "Occupation category: Clerical, Manual, Skilled Manual, Professional, Management."

      - name: survey_total_children
        description: "Self-reported total number of children."

      - name: survey_number_children_at_home
        description: "Self-reported number of children living at home."

      - name: survey_number_cars_owned
        description: "Self-reported number of cars owned."

      - name: survey_is_home_owner
        description: "Self-reported home ownership."

      # --- audit ----------------------------------------------------------
      - name: person_modified_date
        description: >
            Last change to this person in the source system. The source lands this as text,
            so it is cast here. Not a reliable change-detection column: the demo database
            is static.