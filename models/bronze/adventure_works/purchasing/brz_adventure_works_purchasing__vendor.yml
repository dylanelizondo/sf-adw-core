version: 2

models:
  - name: brz_adventure_works_purchasing__vendor
    description: >
        Bronze table over ADVENTURE_WORKS.PURCHASING.VENDOR, exposed one to one with no
        transformations. Company vendors with their credit rating and preferred status.
    config:
      # PRIMARY KEY over business_entity_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_purchasing__vendor PRIMARY KEY (business_entity_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Purchasing"
          termNames:
            - "Purchasing"
          readme: |
            # brz_adventure_works_purchasing__vendor

            Bronze table over ADVENTURE_WORKS.PURCHASING.VENDOR, exposed one to one with no transformations. Company vendors with their credit rating and preferred status.

            **Layer:** bronze  
            **Subject area:** Purchasing

            | Column | Description |
            | --- | --- |
            | ACCOUNT_NUMBER | Vendor account number. |
            | ACTIVE_FLAG | 1 when the company still buys from this vendor, 0 when not. |
            | BUSINESS_ENTITY_ID | PK and FK to PERSON.BUSINESS_ENTITY. Identifies the vendor. |
            | CREDIT_RATING | Credit rating from 1 (best) to 5 (worst). |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Legal name of the vendor. |
            | PREFERRED_VENDOR_STATUS | 1 when the vendor is preferred, 0 when not. |
            | PURCHASING_WEB_SERVICE_URL | URL of the vendor purchasing web service. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: business_entity_id
        description: "PK and FK to PERSON.BUSINESS_ENTITY. Identifies the vendor."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id
      - name: account_number
        description: "Vendor account number."
      - name: name
        description: "Legal name of the vendor."
      - name: credit_rating
        description: "Credit rating from 1 (best) to 5 (worst)."
      - name: preferred_vendor_status
        description: "1 when the vendor is preferred, 0 when not."
      - name: active_flag
        description: "1 when the company still buys from this vendor, 0 when not."
      - name: purchasing_web_service_url
        description: "URL of the vendor purchasing web service."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
