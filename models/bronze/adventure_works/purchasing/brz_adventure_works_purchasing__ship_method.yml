version: 2

models:
  - name: brz_adventure_works_purchasing__ship_method
    description: >
        Bronze table over ADVENTURE_WORKS.PURCHASING.SHIP_METHOD, exposed one to one with no
        transformations. Lookup of shipping methods with their base and variable rates.
    config:
      # PRIMARY KEY over ship_method_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on ship_method_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_purchasing__ship_method PRIMARY KEY (ship_method_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Purchasing"
          termNames:
            - "Purchasing"
          readme: |
            # brz_adventure_works_purchasing__ship_method

            Bronze table over ADVENTURE_WORKS.PURCHASING.SHIP_METHOD, exposed one to one with no transformations. Lookup of shipping methods with their base and variable rates.

            **Layer:** bronze  
            **Subject area:** Purchasing

            | Column | Description |
            | --- | --- |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Name of the shipping method (for example XRQ - TRUCK GROUND). |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SHIP_BASE | Flat charge of the shipping method. |
            | SHIP_METHOD_ID | PK. Unique identifier of the shipping method. |
            | SHIP_RATE | Variable charge per unit of weight. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: ship_method_id
        description: "PK. Unique identifier of the shipping method."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Name of the shipping method (for example XRQ - TRUCK GROUND)."
      - name: ship_base
        description: "Flat charge of the shipping method."
      - name: ship_rate
        description: "Variable charge per unit of weight."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
