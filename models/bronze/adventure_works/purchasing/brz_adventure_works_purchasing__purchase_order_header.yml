version: 2

models:
  - name: brz_adventure_works_purchasing__purchase_order_header
    description: >
        Bronze view over ADVENTURE_WORKS.PURCHASING.PURCHASE_ORDER_HEADER, exposed one to one with
        no transformations. Header of purchase orders placed with vendors, including amounts, status
        and dates. Grain: one row per purchase order.
    columns:
      - name: purchase_order_id
        description: "PK. Unique identifier of the purchase order."
      - name: revision_number
        description: "Revision number of the document. Incremented on every change."
      - name: status
        description: "Order status: 1 = pending, 2 = approved, 3 = rejected, 4 = complete."
      - name: employee_id
        description: "FK to HUMAN_RESOURCES.EMPLOYEE. Buyer who raised the order."
      - name: vendor_id
        description: "FK to PURCHASING.VENDOR. Vendor the order was placed with."
      - name: ship_method_id
        description: "FK to PURCHASING.SHIP_METHOD. Shipping method used."
      - name: order_date
        description: "Date the order was placed."
      - name: ship_date
        description: "Date the document was shipped. Null while it has not shipped."
      - name: sub_total
        description: "Document subtotal before tax and freight."
      - name: tax_amt
        description: "Tax amount charged on the document."
      - name: freight
        description: "Freight cost charged on the document."
      - name: total_due
        description: "Total amount due on the document (subtotal + tax + freight)."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
