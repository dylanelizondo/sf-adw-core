version: 2

models:
  - name: brz_adventure_works_purchasing__purchase_order_header
    description: >
        Bronze table over ADVENTURE_WORKS.PURCHASING.PURCHASE_ORDER_HEADER, exposed one to one with
        no transformations. Header of purchase orders placed with vendors, including amounts, status
        and dates. Grain: one row per purchase order.
    config:
      # PRIMARY KEY over purchase_order_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on purchase_order_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_purchasing__purchase_order_header PRIMARY KEY (purchase_order_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Purchasing"
          termNames:
            - "Purchasing"
          readme: |
            # brz_adventure_works_purchasing__purchase_order_header

            Bronze table over ADVENTURE_WORKS.PURCHASING.PURCHASE_ORDER_HEADER, exposed one to one with no transformations. Header of purchase orders placed with vendors, including amounts, status and dates. Grain: one row per purchase order.

            **Layer:** bronze  
            **Subject area:** Purchasing

            | Column | Description |
            | --- | --- |
            | EMPLOYEE_ID | FK to HUMAN_RESOURCES.EMPLOYEE. Buyer who raised the order. |
            | FREIGHT | Freight cost charged on the document. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | ORDER_DATE | Date the order was placed. |
            | PURCHASE_ORDER_ID | PK. Unique identifier of the purchase order. |
            | REVISION_NUMBER | Revision number of the document. Incremented on every change. |
            | SHIP_DATE | Date the document was shipped. Null while it has not shipped. |
            | SHIP_METHOD_ID | FK to PURCHASING.SHIP_METHOD. Shipping method used. |
            | STATUS | Order status: 1 = pending, 2 = approved, 3 = rejected, 4 = complete. |
            | SUB_TOTAL | Document subtotal before tax and freight. |
            | TAX_AMT | Tax amount charged on the document. |
            | TOTAL_DUE | Total amount due on the document (subtotal + tax + freight). |
            | VENDOR_ID | FK to PURCHASING.VENDOR. Vendor the order was placed with. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: purchase_order_id
        description: "PK. Unique identifier of the purchase order."
        data_tests:
          - unique
          - not_null
      - name: revision_number
        description: "Revision number of the document. Incremented on every change."
      - name: status
        description: "Order status: 1 = pending, 2 = approved, 3 = rejected, 4 = complete."
      - name: employee_id
        description: "FK to HUMAN_RESOURCES.EMPLOYEE. Buyer who raised the order."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_human_resources__employee')
                field: business_entity_id
      - name: vendor_id
        description: "FK to PURCHASING.VENDOR. Vendor the order was placed with."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_purchasing__vendor')
                field: business_entity_id
      - name: ship_method_id
        description: "FK to PURCHASING.SHIP_METHOD. Shipping method used."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_purchasing__ship_method')
                field: ship_method_id
      - name: order_date
        description: "Date the order was placed."
      - name: ship_date
        description: "Date the document was shipped. Null while it has not shipped."
      - name: sub_total
        description: "Document subtotal before tax and freight."
      - name: tax_amt
        description: "Tax amount charged on the document."
      - name: freight
        description: "Freight cost charged on the document."
      - name: total_due
        description: "Total amount due on the document (subtotal + tax + freight)."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
