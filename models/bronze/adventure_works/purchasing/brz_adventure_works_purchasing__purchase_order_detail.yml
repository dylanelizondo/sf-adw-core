  - name: brz_adventure_works_purchasing__purchase_order_detail
    description: >
        Bronze view over ADVENTURE_WORKS.PURCHASING.PURCHASE_ORDER_DETAIL, exposed one to one with
        no transformations. Purchase order lines, with ordered, received, rejected and stocked
        quantities. Grain: one row per purchase order line.
    meta:
      atlan:
        attributes:
          ownerUsers: ["dylan.ea"]
          ownerGroups: ["it_adventure_works"]
          certificateStatus: DRAFT
          certificateStatusMessage: "Synced from dbt."
        domainName: "Purchasing"
        termNames:
          - "Purchasing"
        readme: |
          # brz_adventure_works_purchasing__purchase_order_detail

          Bronze view over ADVENTURE_WORKS.PURCHASING.PURCHASE_ORDER_DETAIL, exposed one to one with no transformations. Purchase order lines, with ordered, received, rejected and stocked quantities. Grain: one row per purchase order line.

          **Layer:** bronze  
          **Subject area:** Purchasing

          | Column | Description |
          | --- | --- |
          | DUE_DATE | Date the delivery was promised for. |
          | LINE_TOTAL | Calculated total for the line. |
          | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
          | ORDER_QTY | Number of units ordered. |
          | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product the record refers to. |
          | PURCHASE_ORDER_DETAIL_ID | PK. Unique identifier of the purchase order line. |
          | PURCHASE_ORDER_ID | FK to PURCHASING.PURCHASE_ORDER_HEADER. Purchase order the record belongs to. |
          | RECEIVED_QTY | Quantity received from the vendor. |
          | REJECTED_QTY | Quantity rejected on quality inspection. |
          | STOCKED_QTY | Quantity actually taken into inventory. |
          | UNIT_PRICE | Unit price applied on the line. |

          _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: purchase_order_id
        description: "FK to PURCHASING.PURCHASE_ORDER_HEADER. Purchase order the record belongs to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_purchasing__purchase_order_header')
                field: purchase_order_id
      - name: purchase_order_detail_id
        description: "PK. Unique identifier of the purchase order line."
        data_tests:
          - unique
          - not_null
      - name: due_date
        description: "Date the delivery was promised for."
      - name: order_qty
        description: "Number of units ordered."
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product the record refers to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: unit_price
        description: "Unit price applied on the line."
      - name: line_total
        description: "Calculated total for the line."
      - name: received_qty
        description: "Quantity received from the vendor."
      - name: rejected_qty
        description: "Quantity rejected on quality inspection."
      - name: stocked_qty
        description: "Quantity actually taken into inventory."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
