version: 2

models:
  - name: brz_adventure_works_person__person
    description: >
        Bronze view over ADVENTURE_WORKS.PERSON.PERSON, exposed one to one with no transformations.
        Naming data for every person in the model: individual customers, employees and contacts.
        PERSON_TYPE states the role each person plays. Contains PII.
    meta:
      atlan:
        attributes:
          ownerUsers: ["dylan.ea"]
          ownerGroups: ["it_adventure_works"]
          certificateStatus: DRAFT
          certificateStatusMessage: "Synced from dbt."
        domainName: "Person"
        termNames:
          - "Person"
        readme: |
          # brz_adventure_works_person__person

          Bronze view over ADVENTURE_WORKS.PERSON.PERSON, exposed one to one with no transformations. Naming data for every person in the model: individual customers, employees and contacts. PERSON_TYPE states the role each person plays. Contains PII.

          **Layer:** bronze  
          **Subject area:** Person

          | Column | Description |
          | --- | --- |
          | ADDITIONAL_CONTACT_INFO | Additional contact information as XML, exactly as delivered by the source. |
          | BUSINESS_ENTITY_ID | PK and FK to PERSON.BUSINESS_ENTITY. Identifies the person. |
          | DEMOGRAPHICS | Demographic attributes of the person as XML, exactly as delivered by the source. |
          | EMAIL_PROMOTION | Marketing preference: 0 = do not contact, 1 = AdventureWorks only, 2 = AdventureWorks and partners. |
          | FIRST_NAME | Given name. Sensitive data (PII). |
          | LAST_NAME | Family name. Sensitive data (PII). |
          | MIDDLE_NAME | Middle name or initial. Sensitive data (PII). |
          | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
          | NAME_STYLE | 0 when the name follows Western order (first name first), 1 when it follows Eastern order. |
          | PERSON_TYPE | Role of the person: SC (store contact), IN (individual customer), SP (sales person), EM (employee), VC (vendor contact), GC (general contact). |
          | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
          | SUFFIX | Name suffix (Jr., III and so on). |
          | TITLE | Courtesy title (Mr., Ms. and so on). Null when not captured. |

          _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: business_entity_id
        description: "PK and FK to PERSON.BUSINESS_ENTITY. Identifies the person."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id
      - name: person_type
        description: "Role of the person: SC (store contact), IN (individual customer), SP (sales person), EM (employee), VC (vendor contact), GC (general contact)."
      - name: name_style
        description: "0 when the name follows Western order (first name first), 1 when it follows Eastern order."
      - name: title
        description: "Courtesy title (Mr., Ms. and so on). Null when not captured."
      - name: first_name
        description: "Given name. Sensitive data (PII)."
      - name: middle_name
        description: "Middle name or initial. Sensitive data (PII)."
      - name: last_name
        description: "Family name. Sensitive data (PII)."
      - name: suffix
        description: "Name suffix (Jr., III and so on)."
      - name: email_promotion
        description: "Marketing preference: 0 = do not contact, 1 = AdventureWorks only, 2 = AdventureWorks and partners."
      - name: additional_contact_info
        description: "Additional contact information as XML, exactly as delivered by the source."
      - name: demographics
        description: "Demographic attributes of the person as XML, exactly as delivered by the source."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
