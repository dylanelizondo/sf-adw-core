version: 2

models:
  - name: brz_adventure_works_person__state_province
    description: >
        Bronze table over ADVENTURE_WORKS.PERSON.STATE_PROVINCE, exposed one to one with no
        transformations. Lookup of states and provinces, tied to a country and to a sales territory.
    config:
      # PRIMARY KEY over state_province_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on state_province_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_person__state_province PRIMARY KEY (state_province_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Person"
          termNames:
            - "Person"
          readme: |
            # brz_adventure_works_person__state_province

            Bronze table over ADVENTURE_WORKS.PERSON.STATE_PROVINCE, exposed one to one with no transformations. Lookup of states and provinces, tied to a country and to a sales territory.

            **Layer:** bronze  
            **Subject area:** Person

            | Column | Description |
            | --- | --- |
            | COUNTRY_REGION_CODE | FK to PERSON.COUNTRY_REGION. ISO code of the country or region. |
            | IS_ONLY_STATE_PROVINCE_FLAG | 1 when the country has no subdivisions and this is the placeholder row. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Name of the state or province. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | STATE_PROVINCE_CODE | Short code of the state or province, unique within the country. |
            | STATE_PROVINCE_ID | PK. Unique identifier of the state or province. |
            | TERRITORY_ID | FK to SALES.SALES_TERRITORY. Sales territory the record belongs to. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: state_province_id
        description: "PK. Unique identifier of the state or province."
        data_tests:
          - unique
          - not_null
      - name: state_province_code
        description: "Short code of the state or province, unique within the country."
      - name: country_region_code
        description: "FK to PERSON.COUNTRY_REGION. ISO code of the country or region."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__country_region')
                field: country_region_code
      - name: is_only_state_province_flag
        description: "1 when the country has no subdivisions and this is the placeholder row."
      - name: name
        description: "Name of the state or province."
      - name: territory_id
        description: "FK to SALES.SALES_TERRITORY. Sales territory the record belongs to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_territory')
                field: territory_id
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
