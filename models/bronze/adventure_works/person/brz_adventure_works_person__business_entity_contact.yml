version: 2

models:
  - name: brz_adventure_works_person__business_entity_contact
    description: >
        Bronze table over ADVENTURE_WORKS.PERSON.BUSINESS_ENTITY_CONTACT, exposed one to one with no
        transformations. Bridge that links contact people to business entities (stores and vendors),
        qualified by contact type.
    config:
      # PRIMARY KEY over business_entity_id + person_id + contact_type_id, applied as
      # DDL after the table is built. A `constraints:` block is only emitted when the
      # model also declares `contract: enforced: true`; without a contract dbt parses
      # it and ignores it, so the key would never reach Snowflake. This hook takes its
      # place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id +
      # person_id + contact_type_id -- those are what actually catch duplicates. What
      # it does buy: the optimizer can use it for join elimination, and BI tools and
      # Snowflake semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_person__business_entity_contact PRIMARY KEY (business_entity_id, person_id, contact_type_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Person"
          termNames:
            - "Person"
          readme: |
            # brz_adventure_works_person__business_entity_contact

            Bronze table over ADVENTURE_WORKS.PERSON.BUSINESS_ENTITY_CONTACT, exposed one to one with no transformations. Bridge that links contact people to business entities (stores and vendors), qualified by contact type.

            **Layer:** bronze  
            **Subject area:** Person

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | FK to PERSON.BUSINESS_ENTITY. Universal identifier of the business entity (person, store or vendor). |
            | CONTACT_TYPE_ID | FK to PERSON.CONTACT_TYPE. Type of contact. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | PERSON_ID | FK to PERSON.PERSON. Person associated with the record. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [business_entity_id, person_id, contact_type_id]

    columns:
      - name: business_entity_id
        description: "FK to PERSON.BUSINESS_ENTITY. Universal identifier of the business entity (person, store or vendor)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id
      - name: person_id
        description: "FK to PERSON.PERSON. Person associated with the record."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__person')
                field: business_entity_id
      - name: contact_type_id
        description: "FK to PERSON.CONTACT_TYPE. Type of contact."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__contact_type')
                field: contact_type_id
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
