version: 2

models:
  - name: brz_adventure_works_person__business_entity_contact
    description: >
        Bronze view over ADVENTURE_WORKS.PERSON.BUSINESS_ENTITY_CONTACT, exposed one to one with no
        transformations. Bridge that links contact people to business entities (stores and vendors),
        qualified by contact type.
    columns:
      - name: business_entity_id
        description: "FK to PERSON.BUSINESS_ENTITY. Universal identifier of the business entity (person, store or vendor)."
      - name: person_id
        description: "FK to PERSON.PERSON. Person associated with the record."
      - name: contact_type_id
        description: "FK to PERSON.CONTACT_TYPE. Type of contact."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
