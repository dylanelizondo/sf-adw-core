version: 2

models:
  - name: brz_adventure_works_person__email_address
    description: >
        Bronze table over ADVENTURE_WORKS.PERSON.EMAIL_ADDRESS, exposed one to one with no
        transformations. Email addresses per person. A person may hold several addresses. Sensitive
        data (PII).
    config:
      # PRIMARY KEY over business_entity_id + email_address_id, applied as DDL after
      # the table is built. A `constraints:` block is only emitted when the model also
      # declares `contract: enforced: true`; without a contract dbt parses it and
      # ignores it, so the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id +
      # email_address_id -- those are what actually catch duplicates. What it does buy:
      # the optimizer can use it for join elimination, and BI tools and Snowflake
      # semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_person__email_address PRIMARY KEY (business_entity_id, email_address_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Person"
          termNames:
            - "Person"
          readme: |
            # brz_adventure_works_person__email_address

            Bronze table over ADVENTURE_WORKS.PERSON.EMAIL_ADDRESS, exposed one to one with no transformations. Email addresses per person. A person may hold several addresses. Sensitive data (PII).

            **Layer:** bronze  
            **Subject area:** Person

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | Part of the PK and FK to PERSON.PERSON. Person who owns the email address. |
            | EMAIL_ADDRESS | Email address. Sensitive data (PII). |
            | EMAIL_ADDRESS_ID | Part of the PK. Sequence of the email address within the person. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [business_entity_id, email_address_id]

    columns:
      - name: business_entity_id
        description: "Part of the PK and FK to PERSON.PERSON. Person who owns the email address."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__person')
                field: business_entity_id
      - name: email_address_id
        description: "Part of the PK. Sequence of the email address within the person."
        data_tests:
          - not_null
      - name: email_address
        description: "Email address. Sensitive data (PII)."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
