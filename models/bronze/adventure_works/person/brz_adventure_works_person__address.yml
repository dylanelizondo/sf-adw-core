version: 2

models:
  - name: brz_adventure_works_person__address
    description: >
        Bronze table over ADVENTURE_WORKS.PERSON.ADDRESS, exposed one to one with no transformations.
        Physical addresses used by customers, employees, stores and vendors. Linked to business
        entities through BUSINESS_ENTITY_ADDRESS.
    config:
      # PRIMARY KEY over address_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on address_id -- those are
      # what actually catch duplicates. What it does buy: the optimizer can use it for
      # join elimination, and BI tools and Snowflake semantic views read it to infer
      # the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_person__address PRIMARY KEY (address_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Person"
          termNames:
            - "Person"
          readme: |
            # brz_adventure_works_person__address

            Bronze table over ADVENTURE_WORKS.PERSON.ADDRESS, exposed one to one with no transformations. Physical addresses used by customers, employees, stores and vendors. Linked to business entities through BUSINESS_ENTITY_ADDRESS.

            **Layer:** bronze  
            **Subject area:** Person

            | Column | Description |
            | --- | --- |
            | ADDRESS_ID | PK. Unique identifier of the address. |
            | ADDRESS_LINE1 | First line of the address (street and number). |
            | ADDRESS_LINE2 | Second line of the address (apartment, suite). Null when not applicable. |
            | CITY | City of the address. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | POSTAL_CODE | Postal code of the address. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SPATIAL_LOCATION | Geographic coordinate of the address (source geography type). |
            | STATE_PROVINCE_ID | FK to PERSON.STATE_PROVINCE. State or province of the record. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: address_id
        description: "PK. Unique identifier of the address."
        data_tests:
          - unique
          - not_null
      - name: address_line1
        description: "First line of the address (street and number)."
      - name: address_line2
        description: "Second line of the address (apartment, suite). Null when not applicable."
      - name: city
        description: "City of the address."
      - name: state_province_id
        description: "FK to PERSON.STATE_PROVINCE. State or province of the record."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__state_province')
                field: state_province_id
      - name: postal_code
        description: "Postal code of the address."
      - name: spatial_location
        description: "Geographic coordinate of the address (source geography type)."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
