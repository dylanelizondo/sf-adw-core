version: 2

models:
  - name: brz_adventure_works_person__password
    description: >
        Bronze view over ADVENTURE_WORKS.PERSON.PASSWORD, exposed one to one with no
        transformations. Access credentials per person, stored as a salted hash. Highly sensitive:
        must not be propagated to consumption layers.
    columns:
      - name: business_entity_id
        description: "PK and FK to PERSON.PERSON. Person who owns the credential."
      - name: password_hash
        description: "Hash of the password. Highly sensitive data."
      - name: password_salt
        description: "Salt used to generate the hash. Highly sensitive data."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
