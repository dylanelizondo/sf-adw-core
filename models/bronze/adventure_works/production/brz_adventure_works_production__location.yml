version: 2

models:
  - name: brz_adventure_works_production__location
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.LOCATION, exposed one to one with no
        transformations. Lookup of inventory and manufacturing locations inside the plant.
    config:
      # PRIMARY KEY over location_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on location_id -- those are
      # what actually catch duplicates. What it does buy: the optimizer can use it for
      # join elimination, and BI tools and Snowflake semantic views read it to infer
      # the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__location PRIMARY KEY (location_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__location

            Bronze table over ADVENTURE_WORKS.PRODUCTION.LOCATION, exposed one to one with no transformations. Lookup of inventory and manufacturing locations inside the plant.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | AVAILABILITY | Available capacity of the location, in hours. |
            | COST_RATE | Hourly cost of using the location in manufacturing. |
            | LOCATION_ID | PK. Unique identifier of the location. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Name of the location (for example Tool Crib, Paint Shop). |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: location_id
        description: "PK. Unique identifier of the location."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Name of the location (for example Tool Crib, Paint Shop)."
      - name: cost_rate
        description: "Hourly cost of using the location in manufacturing."
      - name: availability
        description: "Available capacity of the location, in hours."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
