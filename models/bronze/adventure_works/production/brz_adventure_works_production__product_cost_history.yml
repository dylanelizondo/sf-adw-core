version: 2

models:
  - name: brz_adventure_works_production__product_cost_history
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_COST_HISTORY, exposed one to one with no
        transformations. History of standard cost per product. Grain: product + effective start
        date.
    config:
      # PRIMARY KEY over product_id + start_date, applied as DDL after the table is
      # built. A `constraints:` block is only emitted when the model also declares
      # `contract: enforced: true`; without a contract dbt parses it and ignores it, so
      # the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_id + start_date --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_cost_history PRIMARY KEY (product_id, start_date)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_cost_history

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_COST_HISTORY, exposed one to one with no transformations. History of standard cost per product. Grain: product + effective start date.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | END_DATE | Date the record stopped being effective. Null while it is still current. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | PRODUCT_ID | Part of the PK and FK to PRODUCTION.PRODUCT. Product the cost applies to. |
            | STANDARD_COST | Standard cost in force during the period. |
            | START_DATE | Part of the PK. Date the cost became effective. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [product_id, start_date]

    columns:
      - name: product_id
        description: "Part of the PK and FK to PRODUCTION.PRODUCT. Product the cost applies to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: start_date
        description: "Part of the PK. Date the cost became effective."
        data_tests:
          - not_null
      - name: end_date
        description: "Date the record stopped being effective. Null while it is still current."
      - name: standard_cost
        description: "Standard cost in force during the period."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
