version: 2

models:
  - name: brz_adventure_works_production__transaction_history_archive
    description: >
        Bronze view over ADVENTURE_WORKS.PRODUCTION.TRANSACTION_HISTORY_ARCHIVE, exposed one to one
        with no transformations. Archive of historical product inventory movements generated by
        purchases, sales and work orders.
    columns:
      - name: transactionid
        description: "PK. Unique identifier of the archived transaction."
      - name: productid
        description: "FK to PRODUCTION.PRODUCT. Product involved in the transaction."
      - name: referenceorderid
        description: "Identifier of the purchase order, sales order or work order associated with the transaction."
      - name: referenceorderlineid
        description: "Line identifier within the related purchase, sales or work order."
      - name: transactiondate
        description: "Date and time when the transaction occurred."
      - name: transactiontype
        description: "Transaction type: W (Work Order), S (Sales Order), P (Purchase Order)."
      - name: quantity
        description: "Quantity of product involved in the transaction."
      - name: actualcost
        description: "Actual cost of the product associated with the transaction."
      - name: modifieddate
        description: "Timestamp of the last change to the record in the source system."
