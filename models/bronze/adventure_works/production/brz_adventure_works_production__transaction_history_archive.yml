version: 2

models:
  - name: brz_adventure_works_production__transaction_history_archive
    description: >
        Bronze view over ADVENTURE_WORKS.PRODUCTION.TRANSACTION_HISTORY_ARCHIVE, exposed one to one
        with no transformations. Archive of historical product inventory movements generated by
        purchases, sales and work orders.
    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__transaction_history_archive

            Bronze view over ADVENTURE_WORKS.PRODUCTION.TRANSACTION_HISTORY_ARCHIVE, exposed one to one with no transformations. Archive of historical product inventory movements generated by purchases, sales and work orders.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | ACTUAL_COST | Actual cost of the product associated with the transaction. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product involved in the transaction. |
            | QUANTITY | Quantity of product involved in the transaction. |
            | REFERENCE_ORDER_ID | Identifier of the purchase order, sales order or work order associated with the transaction. |
            | REFERENCE_ORDER_LINE_ID | Line identifier within the related purchase, sales or work order. |
            | TRANSACTION_DATE | Date and time when the transaction occurred. |
            | TRANSACTION_ID | PK. Unique identifier of the archived transaction. |
            | TRANSACTION_TYPE | Transaction type: W (Work Order), S (Sales Order), P (Purchase Order). |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: transaction_id
        description: "PK. Unique identifier of the archived transaction."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product involved in the transaction."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: reference_order_id
        description: "Identifier of the purchase order, sales order or work order associated with the transaction."
      - name: reference_order_line_id
        description: "Line identifier within the related purchase, sales or work order."
      - name: transaction_date
        description: "Date and time when the transaction occurred."
      - name: transaction_type
        description: "Transaction type: W (Work Order), S (Sales Order), P (Purchase Order)."
      - name: quantity
        description: "Quantity of product involved in the transaction."
      - name: actual_cost
        description: "Actual cost of the product associated with the transaction."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
