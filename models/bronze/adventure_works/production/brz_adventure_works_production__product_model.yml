version: 2

models:
  - name: brz_adventure_works_production__product_model
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_MODEL, exposed one to one with no
        transformations. Lookup of product models shared by individual product variants, including
        catalog descriptions and manufacturing instructions.
    config:
      # PRIMARY KEY over product_model_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_model_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_model PRIMARY KEY (product_model_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_model

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_MODEL, exposed one to one with no transformations. Lookup of product models shared by individual product variants, including catalog descriptions and manufacturing instructions.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | CATALOG_DESCRIPTION | XML catalog description of the product model. Null when no catalog description is available. |
            | INSTRUCTIONS | XML manufacturing instructions for the product model. Null when no instructions are available. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
            | NAME | Name of the product model. |
            | PRODUCT_MODEL_ID | PK. Unique identifier of the product model. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: product_model_id
        description: "PK. Unique identifier of the product model."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Name of the product model."
      - name: catalog_description
        description: "XML catalog description of the product model. Null when no catalog description is available."
      - name: instructions
        description: "XML manufacturing instructions for the product model. Null when no instructions are available."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
