version: 2

models:
  - name: brz_adventure_works_production__scrap_reason
    description: >
        Bronze view over ADVENTURE_WORKS.PRODUCTION.SCRAP_REASON, exposed one to one with no
        transformations. Lookup of reasons why units are scrapped during manufacturing.
    columns:
      - name: scrap_reason_id
        description: "PK. Unique identifier of the scrap reason."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Description of the manufacturing failure or scrap reason."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
