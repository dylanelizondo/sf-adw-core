version: 2

models:
  - name: brz_adventure_works_production__product_product_photo
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_PRODUCT_PHOTO, exposed one to one with
        no transformations. Bridge relating products to their product photos and identifying the
        primary photo.
    config:
      # PRIMARY KEY over product_id + product_photo_id, applied as DDL after the table
      # is built. A `constraints:` block is only emitted when the model also declares
      # `contract: enforced: true`; without a contract dbt parses it and ignores it, so
      # the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_id +
      # product_photo_id -- those are what actually catch duplicates. What it does buy:
      # the optimizer can use it for join elimination, and BI tools and Snowflake
      # semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_product_photo PRIMARY KEY (product_id, product_photo_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_product_photo

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_PRODUCT_PHOTO, exposed one to one with no transformations. Bridge relating products to their product photos and identifying the primary photo.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
            | PRIMARY | True when the photo is the primary image for the product, false otherwise. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product associated with the photo. |
            | PRODUCT_PHOTO_ID | FK to PRODUCTION.PRODUCT_PHOTO. Photo associated with the product. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [product_id, product_photo_id]

    columns:
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product associated with the photo."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: product_photo_id
        description: "FK to PRODUCTION.PRODUCT_PHOTO. Photo associated with the product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product_photo')
                field: product_photo_id
      - name: primary
        description: "True when the photo is the primary image for the product, false otherwise."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
