version: 2

models:
  - name: brz_adventure_works_production__document
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.DOCUMENT, exposed one to one with no
        transformations. Stores product-related document metadata, document hierarchy, ownership
        and status information.
    config:
      # PRIMARY KEY over document_node, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on document_node -- those are
      # what actually catch duplicates. What it does buy: the optimizer can use it for
      # join elimination, and BI tools and Snowflake semantic views read it to infer
      # the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__document PRIMARY KEY (document_node)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__document

            Bronze table over ADVENTURE_WORKS.PRODUCTION.DOCUMENT, exposed one to one with no transformations. Stores product-related document metadata, document hierarchy, ownership and status information.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | CHANGE_NUMBER | Engineering change number associated with the document. |
            | DOCUMENT_LEVEL | Depth of the document within the document hierarchy. |
            | DOCUMENT_NODE | PK. Hierarchy path that uniquely identifies the document in the source system. |
            | DOCUMENT_SUMMARY | Summary or description of the document. Null when no summary is available. |
            | FILE_EXTENSION | File extension of the document. |
            | FILE_NAME | Name of the document file. |
            | FOLDER_FLAG | True when the row represents a folder, false when it represents a document. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
            | OWNER | Identifier of the employee that owns the document. |
            | REVISION | Revision identifier assigned to the document. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | STATUS | Document status code. |
            | TITLE | Title of the document. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: document_node
        description: "PK. Hierarchy path that uniquely identifies the document in the source system."
        data_tests:
          - unique
          - not_null
      - name: document_level
        description: "Depth of the document within the document hierarchy."
      - name: title
        description: "Title of the document."
      - name: owner
        description: "Identifier of the employee that owns the document."
      - name: folder_flag
        description: "True when the row represents a folder, false when it represents a document."
      - name: file_name
        description: "Name of the document file."
      - name: file_extension
        description: "File extension of the document."
      - name: revision
        description: "Revision identifier assigned to the document."
      - name: change_number
        description: "Engineering change number associated with the document."
      - name: status
        description: "Document status code."
      - name: document_summary
        description: "Summary or description of the document. Null when no summary is available."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
