version: 2

models:
  - name: brz_adventure_works_production__illustration
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.ILLUSTRATION, exposed one to one with no
        transformations. Stores technical diagrams that can be associated with product models.
    config:
      # PRIMARY KEY over illustration_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on illustration_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__illustration PRIMARY KEY (illustration_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__illustration

            Bronze table over ADVENTURE_WORKS.PRODUCTION.ILLUSTRATION, exposed one to one with no transformations. Stores technical diagrams that can be associated with product models.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | DIAGRAM | XML representation of the technical illustration. Null when no diagram is available. |
            | ILLUSTRATION_ID | PK. Unique identifier of the illustration. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: illustration_id
        description: "PK. Unique identifier of the illustration."
        data_tests:
          - unique
          - not_null
      - name: diagram
        description: "XML representation of the technical illustration. Null when no diagram is available."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
