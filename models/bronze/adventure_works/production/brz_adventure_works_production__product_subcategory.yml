version: 2

models:
  - name: brz_adventure_works_production__product_subcategory
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_SUBCATEGORY, exposed one to one with no
        transformations. Lookup of product subcategories: the level between category and product.
    config:
      # PRIMARY KEY over product_subcategory_id, applied as DDL after the table is
      # built. A `constraints:` block is only emitted when the model also declares
      # `contract: enforced: true`; without a contract dbt parses it and ignores it, so
      # the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_subcategory_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_subcategory PRIMARY KEY (product_subcategory_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_subcategory

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_SUBCATEGORY, exposed one to one with no transformations. Lookup of product subcategories: the level between category and product.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Name of the subcategory (for example Mountain Bikes, Road Frames). |
            | PRODUCT_CATEGORY_ID | FK to PRODUCTION.PRODUCT_CATEGORY. Category of the product. |
            | PRODUCT_SUBCATEGORY_ID | PK. Unique identifier of the subcategory. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: product_subcategory_id
        description: "PK. Unique identifier of the subcategory."
        data_tests:
          - unique
          - not_null
      - name: product_category_id
        description: "FK to PRODUCTION.PRODUCT_CATEGORY. Category of the product."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product_category')
                field: product_category_id
      - name: name
        description: "Name of the subcategory (for example Mountain Bikes, Road Frames)."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
