version: 2

models:
  - name: brz_adventure_works_production__product_photo
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_PHOTO, exposed one to one with no
        transformations. Stores file-name metadata for product thumbnail and large-format photos.
    config:
      # PRIMARY KEY over product_photo_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_photo_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_photo PRIMARY KEY (product_photo_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_photo

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_PHOTO, exposed one to one with no transformations. Stores file-name metadata for product thumbnail and large-format photos.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | LARGE_PHOTO_FILE_NAME | File name of the large product image. Null when no large image file is available. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
            | PRODUCT_PHOTO_ID | PK. Unique identifier of the product photo. |
            | THUMBNAIL_PHOTO_FILE_NAME | File name of the thumbnail product image. Null when no thumbnail file is available. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: product_photo_id
        description: "PK. Unique identifier of the product photo."
        data_tests:
          - unique
          - not_null
      - name: thumbnail_photo_file_name
        description: "File name of the thumbnail product image. Null when no thumbnail file is available."
      - name: large_photo_file_name
        description: "File name of the large product image. Null when no large image file is available."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
