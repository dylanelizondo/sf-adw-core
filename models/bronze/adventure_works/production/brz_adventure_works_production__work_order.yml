version: 2

models:
  - name: brz_adventure_works_production__work_order
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.WORK_ORDER, exposed one to one with no
        transformations. Manufacturing work orders with produced and scrapped quantities plus the
        cycle dates.
    config:
      # PRIMARY KEY over work_order_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on work_order_id -- those are
      # what actually catch duplicates. What it does buy: the optimizer can use it for
      # join elimination, and BI tools and Snowflake semantic views read it to infer
      # the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__work_order PRIMARY KEY (work_order_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__work_order

            Bronze table over ADVENTURE_WORKS.PRODUCTION.WORK_ORDER, exposed one to one with no transformations. Manufacturing work orders with produced and scrapped quantities plus the cycle dates.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | DUE_DATE | Date the delivery was promised for. |
            | END_DATE | Date manufacturing finished. Null while the order is still open. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | ORDER_QTY | Units to be manufactured on the order. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product being manufactured. |
            | SCRAPPED_QTY | Quantity scrapped because of defects. |
            | SCRAP_REASON_ID | Identifier of the scrap reason. Null when nothing was scrapped. |
            | START_DATE | Date manufacturing started. |
            | STOCKED_QTY | Quantity actually taken into inventory. |
            | WORK_ORDER_ID | PK. Unique identifier of the work order. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: work_order_id
        description: "PK. Unique identifier of the work order."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product being manufactured."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: order_qty
        description: "Units to be manufactured on the order."
      - name: stocked_qty
        description: "Quantity actually taken into inventory."
      - name: scrapped_qty
        description: "Quantity scrapped because of defects."
      - name: start_date
        description: "Date manufacturing started."
      - name: end_date
        description: "Date manufacturing finished. Null while the order is still open."
      - name: due_date
        description: "Date the delivery was promised for."
      - name: scrap_reason_id
        description: "Identifier of the scrap reason. Null when nothing was scrapped."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
