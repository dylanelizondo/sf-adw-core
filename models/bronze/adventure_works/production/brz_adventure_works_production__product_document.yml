version: 2

models:
  - name: brz_adventure_works_production__product_document
    description: >
        Bronze view over ADVENTURE_WORKS.PRODUCTION.PRODUCT_DOCUMENT, exposed one to one with no
        transformations. Bridge relating products to their associated technical documents.
