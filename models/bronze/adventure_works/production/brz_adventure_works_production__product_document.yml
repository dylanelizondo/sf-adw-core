        domainName: "Production"
        termNames:
          - "Production"
        readme: |
          # brz_adventure_works_production__product_document

          Bronze view over ADVENTURE_WORKS.PRODUCTION.PRODUCT_DOCUMENT, exposed one to one with no transformations. Bridge relating products to their associated technical documents.

          **Layer:** bronze  
          **Subject area:** Production

          | Column | Description |
          | --- | --- |
          | DOCUMENT_NODE | FK to PRODUCTION.DOCUMENT. Document associated with the product. |
          | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
          | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product associated with the document. |

          _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [product_id, document_node]

    columns:
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product associated with the document."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: document_node
        description: "FK to PRODUCTION.DOCUMENT. Document associated with the product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__document')
                field: document_node
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
