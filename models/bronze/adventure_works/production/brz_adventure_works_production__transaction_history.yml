version: 2

models:
  - name: brz_adventure_works_production__transaction_history
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.TRANSACTION_HISTORY, exposed one to one with no
        transformations. Log of inventory movements driven by purchases, sales and work orders. It
        is the product movement fact table and the highest volume table in the schema.
    config:
      # PRIMARY KEY over transaction_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on transaction_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__transaction_history PRIMARY KEY (transaction_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__transaction_history

            Bronze table over ADVENTURE_WORKS.PRODUCTION.TRANSACTION_HISTORY, exposed one to one with no transformations. Log of inventory movements driven by purchases, sales and work orders. It is the product movement fact table and the highest volume table in the schema.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | ACTUAL_COST | Actual cost of the movement. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product the record refers to. |
            | QUANTITY | Units moved. |
            | REFERENCE_ORDER_ID | Identifier of the document that drove the movement. Its meaning depends on TRANSACTION_TYPE. |
            | REFERENCE_ORDER_LINE_ID | Line of the document that drove the movement. |
            | TRANSACTION_DATE | Date of the inventory movement. |
            | TRANSACTION_ID | PK. Unique identifier of the movement. |
            | TRANSACTION_TYPE | Movement type: W (work order), S (sales), P (purchase). |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: transaction_id
        description: "PK. Unique identifier of the movement."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product the record refers to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: reference_order_id
        description: "Identifier of the document that drove the movement. Its meaning depends on TRANSACTION_TYPE."
      - name: reference_order_line_id
        description: "Line of the document that drove the movement."
      - name: transaction_date
        description: "Date of the inventory movement."
      - name: transaction_type
        description: "Movement type: W (work order), S (sales), P (purchase)."
      - name: quantity
        description: "Units moved."
      - name: actual_cost
        description: "Actual cost of the movement."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
