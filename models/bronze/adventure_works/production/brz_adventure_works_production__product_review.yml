version: 2

models:
  - name: brz_adventure_works_production__product_review
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_REVIEW, exposed one to one with no
        transformations. Customer reviews of products, including reviewer details, ratings and
        comments.
    config:
      # PRIMARY KEY over product_review_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_review_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_review PRIMARY KEY (product_review_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_review

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_REVIEW, exposed one to one with no transformations. Customer reviews of products, including reviewer details, ratings and comments.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | COMMENTS | Free-text comments supplied by the reviewer. Null when no comments were provided. |
            | EMAIL_ADDRESS | Email address supplied by the reviewer. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product being reviewed. |
            | PRODUCT_REVIEW_ID | PK. Unique identifier of the product review. |
            | RATING | Product rating from 1 to 5. |
            | REVIEWER_NAME | Name of the person who submitted the review. |
            | REVIEW_DATE | Date and time when the review was submitted. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: product_review_id
        description: "PK. Unique identifier of the product review."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product being reviewed."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: reviewer_name
        description: "Name of the person who submitted the review."
      - name: review_date
        description: "Date and time when the review was submitted."
      - name: email_address
        description: "Email address supplied by the reviewer."
      - name: rating
        description: "Product rating from 1 to 5."
      - name: comments
        description: "Free-text comments supplied by the reviewer. Null when no comments were provided."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system."
