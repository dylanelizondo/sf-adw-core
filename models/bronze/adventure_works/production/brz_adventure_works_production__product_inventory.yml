version: 2

models:
  - name: brz_adventure_works_production__product_inventory
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_INVENTORY, exposed one to one with no
        transformations. Stock on hand per product and location, including its physical position in
        the warehouse. Grain: product + location.
    config:
      # PRIMARY KEY over product_id + location_id, applied as DDL after the table is
      # built. A `constraints:` block is only emitted when the model also declares
      # `contract: enforced: true`; without a contract dbt parses it and ignores it, so
      # the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on product_id + location_id
      # -- those are what actually catch duplicates. What it does buy: the optimizer
      # can use it for join elimination, and BI tools and Snowflake semantic views read
      # it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__product_inventory PRIMARY KEY (product_id, location_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__product_inventory

            Bronze table over ADVENTURE_WORKS.PRODUCTION.PRODUCT_INVENTORY, exposed one to one with no transformations. Stock on hand per product and location, including its physical position in the warehouse. Grain: product + location.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | BIN | Bin within the shelf. |
            | LOCATION_ID | Part of the PK and FK to PRODUCTION.LOCATION. Location where it is stored. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | PRODUCT_ID | Part of the PK and FK to PRODUCTION.PRODUCT. Product held in stock. |
            | QUANTITY | Units on hand at that location. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SHELF | Shelf where the product is stored. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [product_id, location_id]

    columns:
      - name: product_id
        description: "Part of the PK and FK to PRODUCTION.PRODUCT. Product held in stock."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: location_id
        description: "Part of the PK and FK to PRODUCTION.LOCATION. Location where it is stored."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__location')
                field: location_id
      - name: shelf
        description: "Shelf where the product is stored."
      - name: bin
        description: "Bin within the shelf."
      - name: quantity
        description: "Units on hand at that location."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
