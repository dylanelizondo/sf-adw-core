version: 2

models:
  - name: brz_adventure_works_production__work_order_routing
    description: >
        Bronze table over ADVENTURE_WORKS.PRODUCTION.WORK_ORDER_ROUTING, exposed one to one with no
        transformations. Manufacturing routing for each work order: one row per operation, with
        planned versus actual costs and dates. Grain: work order + product + operation sequence.
    config:
      # PRIMARY KEY over work_order_id + product_id + operation_sequence, applied as
      # DDL after the table is built. A `constraints:` block is only emitted when the
      # model also declares `contract: enforced: true`; without a contract dbt parses
      # it and ignores it, so the key would never reach Snowflake. This hook takes its
      # place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on work_order_id + product_id
      # + operation_sequence -- those are what actually catch duplicates. What it does
      # buy: the optimizer can use it for join elimination, and BI tools and Snowflake
      # semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_production__work_order_routing PRIMARY KEY (work_order_id, product_id, operation_sequence)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Production"
          termNames:
            - "Production"
          readme: |
            # brz_adventure_works_production__work_order_routing

            Bronze table over ADVENTURE_WORKS.PRODUCTION.WORK_ORDER_ROUTING, exposed one to one with no transformations. Manufacturing routing for each work order: one row per operation, with planned versus actual costs and dates. Grain: work order + product + operation sequence.

            **Layer:** bronze  
            **Subject area:** Production

            | Column | Description |
            | --- | --- |
            | ACTUAL_COST | Actual cost of the operation. |
            | ACTUAL_END_DATE | Actual end date of the operation. |
            | ACTUAL_RESOURCE_HRS | Resource hours actually consumed by the operation. |
            | ACTUAL_START_DATE | Actual start date of the operation. |
            | LOCATION_ID | FK to PRODUCTION.LOCATION. Location inside the plant. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | OPERATION_SEQUENCE | Sequence number of the operation within the manufacturing routing. |
            | PLANNED_COST | Planned cost of the operation. |
            | PRODUCT_ID | Part of the PK and FK to PRODUCTION.PRODUCT. Product being manufactured. |
            | SCHEDULED_END_DATE | Planned end date of the operation. |
            | SCHEDULED_START_DATE | Planned start date of the operation. |
            | WORK_ORDER_ID | Part of the PK and FK to PRODUCTION.WORK_ORDER. Work order being routed. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [work_order_id, product_id, operation_sequence]

    columns:
      - name: work_order_id
        description: "Part of the PK and FK to PRODUCTION.WORK_ORDER. Work order being routed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__work_order')
                field: work_order_id
      - name: product_id
        description: "Part of the PK and FK to PRODUCTION.PRODUCT. Product being manufactured."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: operation_sequence
        description: "Sequence number of the operation within the manufacturing routing."
        data_tests:
          - not_null
      - name: location_id
        description: "FK to PRODUCTION.LOCATION. Location inside the plant."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__location')
                field: location_id
      - name: scheduled_start_date
        description: "Planned start date of the operation."
      - name: scheduled_end_date
        description: "Planned end date of the operation."
      - name: actual_start_date
        description: "Actual start date of the operation."
      - name: actual_end_date
        description: "Actual end date of the operation."
      - name: actual_resource_hrs
        description: "Resource hours actually consumed by the operation."
      - name: planned_cost
        description: "Planned cost of the operation."
      - name: actual_cost
        description: "Actual cost of the operation."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
