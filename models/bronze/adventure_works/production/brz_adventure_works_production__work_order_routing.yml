        readme: |
          # brz_adventure_works_production__work_order_routing

          Bronze view over ADVENTURE_WORKS.PRODUCTION.WORK_ORDER_ROUTING, exposed one to one with no transformations. Manufacturing routing for each work order: one row per operation, with planned versus actual costs and dates. Grain: work order + product + operation sequence.

          **Layer:** bronze  
          **Subject area:** Production

          | Column | Description |
          | --- | --- |
          | ACTUAL_COST | Actual cost of the operation. |
          | ACTUAL_END_DATE | Actual end date of the operation. |
          | ACTUAL_RESOURCE_HRS | Resource hours actually consumed by the operation. |
          | ACTUAL_START_DATE | Actual start date of the operation. |
          | LOCATION_ID | FK to PRODUCTION.LOCATION. Location inside the plant. |
          | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
          | OPERATION_SEQUENCE | Sequence number of the operation within the manufacturing routing. |
          | PLANNED_COST | Planned cost of the operation. |
          | PRODUCT_ID | Part of the PK and FK to PRODUCTION.PRODUCT. Product being manufactured. |
          | SCHEDULED_END_DATE | Planned end date of the operation. |
          | SCHEDULED_START_DATE | Planned start date of the operation. |
          | WORK_ORDER_ID | Part of the PK and FK to PRODUCTION.WORK_ORDER. Work order being routed. |

          _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [work_order_id, product_id, operation_sequence]

    columns:
      - name: work_order_id
        description: "Part of the PK and FK to PRODUCTION.WORK_ORDER. Work order being routed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__work_order')
                field: work_order_id
      - name: product_id
        description: "Part of the PK and FK to PRODUCTION.PRODUCT. Product being manufactured."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: operation_sequence
        description: "Sequence number of the operation within the manufacturing routing."
        data_tests:
          - not_null
      - name: location_id
        description: "FK to PRODUCTION.LOCATION. Location inside the plant."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__location')
                field: location_id
      - name: scheduled_start_date
        description: "Planned start date of the operation."
      - name: scheduled_end_date
        description: "Planned end date of the operation."
      - name: actual_start_date
        description: "Actual start date of the operation."
      - name: actual_end_date
        description: "Actual end date of the operation."
      - name: actual_resource_hrs
        description: "Resource hours actually consumed by the operation."
      - name: planned_cost
        description: "Planned cost of the operation."
      - name: actual_cost
        description: "Actual cost of the operation."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
