version: 2

models:
  - name: brz_adventure_works_sales__sales_reason
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SALES_REASON, exposed one to one with no
        transformations. Lookup of the reasons a customer gave for a purchase, grouped by reason
        type. Referenced by SALES_ORDER_HEADER_SALES_REASON. Grain: one row per reason. The source
        columns are named without separators, unlike the rest of the schema; bronze keeps them as
        they arrive and aligning them belongs in the silver layer.
    config:
      # PRIMARY KEY over salesreasonid, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on salesreasonid -- those are
      # what actually catch duplicates. What it does buy: the optimizer can use it for
      # join elimination, and BI tools and Snowflake semantic views read it to infer
      # the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__sales_reason PRIMARY KEY (salesreasonid)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__sales_reason

            Bronze table over ADVENTURE_WORKS.SALES.SALES_REASON, exposed one to one with no transformations. Lookup of the reasons a customer gave for a purchase, grouped by reason type. Referenced by SALES_ORDER_HEADER_SALES_REASON. Grain: one row per reason. The source columns are named without separators, unlike the rest of the schema; bronze keeps them as they arrive and aligning them belongs in the silver layer.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | MODIFIEDDATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Name of the reason (for example Price, Quality, Manufacturer). |
            | REASONTYPE | Grouping the reason belongs to: Marketing, Other or Promotion. |
            | SALESREASONID | PK. Unique identifier of the reason. Named SALES_REASON_ID in the rest of the schema. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: salesreasonid
        description: "PK. Unique identifier of the reason. Named SALES_REASON_ID in the rest of the schema."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Name of the reason (for example Price, Quality, Manufacturer)."
      - name: reasontype
        description: "Grouping the reason belongs to: Marketing, Other or Promotion."
      - name: modifieddate
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
