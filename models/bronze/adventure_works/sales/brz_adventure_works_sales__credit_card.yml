version: 2

models:
  - name: brz_adventure_works_sales__credit_card
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.CREDIT_CARD, exposed one to one with no
        transformations. Credit cards registered for payment, with their brand and expiry. Holds
        sensitive payment data: restrict how far it propagates into consumption layers.
    config:
      # PRIMARY KEY over credit_card_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on credit_card_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__credit_card PRIMARY KEY (credit_card_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__credit_card

            Bronze table over ADVENTURE_WORKS.SALES.CREDIT_CARD, exposed one to one with no transformations. Credit cards registered for payment, with their brand and expiry. Holds sensitive payment data: restrict how far it propagates into consumption layers.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | CARD_NUMBER | Card number. Highly sensitive data. |
            | CARD_TYPE | Card brand (Vista, SuperiorCard, Distinguish, ColonialVoice). |
            | CREDIT_CARD_ID | PK. Unique identifier of the credit card. |
            | EXP_MONTH | Expiry month of the card. |
            | EXP_YEAR | Expiry year of the card. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: credit_card_id
        description: "PK. Unique identifier of the credit card."
        data_tests:
          - unique
          - not_null
      - name: card_type
        description: "Card brand (Vista, SuperiorCard, Distinguish, ColonialVoice)."
      - name: card_number
        description: "Card number. Highly sensitive data."
      - name: exp_month
        description: "Expiry month of the card."
      - name: exp_year
        description: "Expiry year of the card."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
