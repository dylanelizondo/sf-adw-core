version: 2

models:
  - name: brz_adventure_works_sales__country_region_currency
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.COUNTRY_REGION_CURRENCY, exposed one to one with no
        transformations. Bridge stating which currencies are used in each country or region. Grain:
        country + currency.
    config:
      # PRIMARY KEY over country_region_code + currency_code, applied as DDL after the
      # table is built. A `constraints:` block is only emitted when the model also
      # declares `contract: enforced: true`; without a contract dbt parses it and
      # ignores it, so the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on country_region_code +
      # currency_code -- those are what actually catch duplicates. What it does buy:
      # the optimizer can use it for join elimination, and BI tools and Snowflake
      # semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__country_region_currency PRIMARY KEY (country_region_code, currency_code)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__country_region_currency

            Bronze table over ADVENTURE_WORKS.SALES.COUNTRY_REGION_CURRENCY, exposed one to one with no transformations. Bridge stating which currencies are used in each country or region. Grain: country + currency.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | COUNTRY_REGION_CODE | FK to PERSON.COUNTRY_REGION. ISO code of the country or region. |
            | CURRENCY_CODE | FK to SALES.CURRENCY. ISO code of the currency. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [country_region_code, currency_code]

    columns:
      - name: country_region_code
        description: "FK to PERSON.COUNTRY_REGION. ISO code of the country or region."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__country_region')
                field: country_region_code
      - name: currency_code
        description: "FK to SALES.CURRENCY. ISO code of the currency."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__currency')
                field: currency_code
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
