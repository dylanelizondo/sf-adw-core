version: 2

models:
  - name: brz_adventure_works_sales__special_offer
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SPECIAL_OFFER, exposed one to one with no
        transformations. Lookup of promotions and discounts, with validity dates and the quantity
        range they apply to.
    config:
      # PRIMARY KEY over special_offer_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on special_offer_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__special_offer PRIMARY KEY (special_offer_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__special_offer

            Bronze table over ADVENTURE_WORKS.SALES.SPECIAL_OFFER, exposed one to one with no transformations. Lookup of promotions and discounts, with validity dates and the quantity range they apply to.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | CATEGORY | Audience the promotion targets: Reseller or Customer. |
            | DESCRIPTION | Description of the promotion. |
            | DISCOUNT_PCT | Discount percentage granted by the promotion. |
            | END_DATE | Date the record stopped being effective. Null while it is still current. |
            | MAX_QTY | Maximum quantity the promotion applies up to. Null when there is no cap. |
            | MIN_QTY | Minimum quantity for the promotion to apply. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SPECIAL_OFFER_ID | PK. Unique identifier of the promotion. |
            | START_DATE | Date the record became effective. |
            | TYPE | Promotion type (for example Volume Discount, Discontinued Product). |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: special_offer_id
        description: "PK. Unique identifier of the promotion."
        data_tests:
          - unique
          - not_null
      - name: description
        description: "Description of the promotion."
      - name: discount_pct
        description: "Discount percentage granted by the promotion."
      - name: type
        description: "Promotion type (for example Volume Discount, Discontinued Product)."
      - name: category
        description: "Audience the promotion targets: Reseller or Customer."
      - name: start_date
        description: "Date the record became effective."
      - name: end_date
        description: "Date the record stopped being effective. Null while it is still current."
      - name: min_qty
        description: "Minimum quantity for the promotion to apply."
      - name: max_qty
        description: "Maximum quantity the promotion applies up to. Null when there is no cap."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
