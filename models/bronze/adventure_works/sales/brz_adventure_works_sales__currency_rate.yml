version: 2

models:
  - name: brz_adventure_works_sales__currency_rate
    description: >
        Bronze view over ADVENTURE_WORKS.SALES.CURRENCY_RATE, exposed one to one with no
        transformations. Daily exchange rates between currency pairs. Grain: date + from currency +
        to currency.
    config:
      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__currency_rate

            Bronze view over ADVENTURE_WORKS.SALES.CURRENCY_RATE, exposed one to one with no transformations. Daily exchange rates between currency pairs. Grain: date + from currency + to currency.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | AVERAGE_RATE | Average exchange rate for the day. |
            | CURRENCY_RATE_DATE | Date the exchange rate applies to. |
            | CURRENCY_RATE_ID | PK. Unique identifier of the exchange rate. |
            | END_OF_DAY_RATE | Exchange rate at the close of the day. |
            | FROM_CURRENCY_CODE | FK to SALES.CURRENCY. Source currency of the conversion. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | TO_CURRENCY_CODE | FK to SALES.CURRENCY. Target currency of the conversion. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: currency_rate_id
        description: "PK. Unique identifier of the exchange rate."
        data_tests:
          - unique
          - not_null
      - name: currency_rate_date
        description: "Date the exchange rate applies to."
      - name: from_currency_code
        description: "FK to SALES.CURRENCY. Source currency of the conversion."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__currency')
                field: currency_code
      - name: to_currency_code
        description: "FK to SALES.CURRENCY. Target currency of the conversion."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__currency')
                field: currency_code
      - name: average_rate
        description: "Average exchange rate for the day."
      - name: end_of_day_rate
        description: "Exchange rate at the close of the day."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
