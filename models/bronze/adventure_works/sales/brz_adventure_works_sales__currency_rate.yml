version: 2

models:
  - name: brz_adventure_works_sales__currency_rate
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.CURRENCY_RATE, exposed one to one with no
        transformations. Daily exchange rates between currency pairs. Grain: date + from currency +
        to currency.
    config:
      # PRIMARY KEY over currency_rate_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on currency_rate_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__currency_rate PRIMARY KEY (currency_rate_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__currency_rate

            Bronze table over ADVENTURE_WORKS.SALES.CURRENCY_RATE, exposed one to one with no transformations. Daily exchange rates between currency pairs. Grain: date + from currency + to currency.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | AVERAGE_RATE | Average exchange rate for the day. |
            | CURRENCY_RATE_DATE | Date the exchange rate applies to. |
            | CURRENCY_RATE_ID | PK. Unique identifier of the exchange rate. |
            | END_OF_DAY_RATE | Exchange rate at the close of the day. |
            | FROM_CURRENCY_CODE | FK to SALES.CURRENCY. Source currency of the conversion. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | TO_CURRENCY_CODE | FK to SALES.CURRENCY. Target currency of the conversion. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: currency_rate_id
        description: "PK. Unique identifier of the exchange rate."
        data_tests:
          - unique
          - not_null
      - name: currency_rate_date
        description: "Date the exchange rate applies to."
      - name: from_currency_code
        description: "FK to SALES.CURRENCY. Source currency of the conversion."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__currency')
                field: currency_code
      - name: to_currency_code
        description: "FK to SALES.CURRENCY. Target currency of the conversion."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__currency')
                field: currency_code
      - name: average_rate
        description: "Average exchange rate for the day."
      - name: end_of_day_rate
        description: "Exchange rate at the close of the day."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
