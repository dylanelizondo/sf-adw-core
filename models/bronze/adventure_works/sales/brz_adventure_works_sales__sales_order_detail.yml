version: 2

models:
  - name: brz_adventure_works_sales__sales_order_detail
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SALES_ORDER_DETAIL, exposed one to one with no
        transformations. Sales order lines with product, quantity, price and discount applied. It is
        the finest grain sales fact table and the highest volume table in the schema.
    config:
      # PRIMARY KEY over sales_order_detail_id, applied as DDL after the table is
      # built. A `constraints:` block is only emitted when the model also declares
      # `contract: enforced: true`; without a contract dbt parses it and ignores it, so
      # the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on sales_order_detail_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__sales_order_detail PRIMARY KEY (sales_order_detail_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__sales_order_detail

            Bronze table over ADVENTURE_WORKS.SALES.SALES_ORDER_DETAIL, exposed one to one with no transformations. Sales order lines with product, quantity, price and discount applied. It is the finest grain sales fact table and the highest volume table in the schema.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | CARRIER_TRACKING_NUMBER | Carrier tracking number for the line. |
            | LINE_TOTAL | Line total, computed in the source system as quantity times price net of discount. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | ORDER_QTY | Number of units ordered. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product the record refers to. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SALES_ORDER_DETAIL_ID | PK. Unique identifier of the sales order line. |
            | SALES_ORDER_ID | FK to SALES.SALES_ORDER_HEADER. Sales order the record belongs to. |
            | SPECIAL_OFFER_ID | FK to SALES.SPECIAL_OFFER. Promotion applied. |
            | UNIT_PRICE | Unit price applied on the line. |
            | UNIT_PRICE_DISCOUNT | Discount applied to the unit price, as a decimal fraction. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: sales_order_id
        description: "FK to SALES.SALES_ORDER_HEADER. Sales order the record belongs to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_order_header')
                field: sales_order_id
      - name: sales_order_detail_id
        description: "PK. Unique identifier of the sales order line."
        data_tests:
          - unique
          - not_null
      - name: carrier_tracking_number
        description: "Carrier tracking number for the line."
      - name: order_qty
        description: "Number of units ordered."
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product the record refers to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: special_offer_id
        description: "FK to SALES.SPECIAL_OFFER. Promotion applied."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__special_offer')
                field: special_offer_id
      - name: unit_price
        description: "Unit price applied on the line."
      - name: unit_price_discount
        description: "Discount applied to the unit price, as a decimal fraction."
      - name: line_total
        description: "Line total, computed in the source system as quantity times price net of discount."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
