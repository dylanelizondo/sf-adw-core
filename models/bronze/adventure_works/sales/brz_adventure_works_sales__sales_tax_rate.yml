version: 2

models:
  - name: brz_adventure_works_sales__sales_tax_rate
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SALES_TAX_RATE, exposed one to one with no
        transformations. Tax rates by state or province and tax type.
    config:
      # PRIMARY KEY over sales_tax_rate_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on sales_tax_rate_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__sales_tax_rate PRIMARY KEY (sales_tax_rate_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__sales_tax_rate

            Bronze table over ADVENTURE_WORKS.SALES.SALES_TAX_RATE, exposed one to one with no transformations. Tax rates by state or province and tax type.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Descriptive name of the tax rate. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SALES_TAX_RATE_ID | PK. Unique identifier of the tax rate. |
            | STATE_PROVINCE_ID | FK to PERSON.STATE_PROVINCE. State or province of the record. |
            | TAX_RATE | Applicable tax rate, as a percentage. |
            | TAX_TYPE | Tax type: 1 = shipping only, 2 = state only, 3 = both. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: sales_tax_rate_id
        description: "PK. Unique identifier of the tax rate."
        data_tests:
          - unique
          - not_null
      - name: state_province_id
        description: "FK to PERSON.STATE_PROVINCE. State or province of the record."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__state_province')
                field: state_province_id
      - name: tax_type
        description: "Tax type: 1 = shipping only, 2 = state only, 3 = both."
      - name: tax_rate
        description: "Applicable tax rate, as a percentage."
      - name: name
        description: "Descriptive name of the tax rate."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
