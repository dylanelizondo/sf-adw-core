version: 2

models:
  - name: brz_adventure_works_sales__person_credit_card
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.PERSON_CREDIT_CARD, exposed one to one with no
        transformations. Bridge between people and their credit cards. Grain: person + credit card.
    config:
      # PRIMARY KEY over business_entity_id + credit_card_id, applied as DDL after the
      # table is built. A `constraints:` block is only emitted when the model also
      # declares `contract: enforced: true`; without a contract dbt parses it and
      # ignores it, so the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id +
      # credit_card_id -- those are what actually catch duplicates. What it does buy:
      # the optimizer can use it for join elimination, and BI tools and Snowflake
      # semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__person_credit_card PRIMARY KEY (business_entity_id, credit_card_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__person_credit_card

            Bronze table over ADVENTURE_WORKS.SALES.PERSON_CREDIT_CARD, exposed one to one with no transformations. Bridge between people and their credit cards. Grain: person + credit card.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | FK to PERSON.BUSINESS_ENTITY. Universal identifier of the business entity (person, store or vendor). |
            | CREDIT_CARD_ID | FK to SALES.CREDIT_CARD. Credit card associated with the record. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [business_entity_id, credit_card_id]

    columns:
      - name: business_entity_id
        description: "FK to PERSON.BUSINESS_ENTITY. Universal identifier of the business entity (person, store or vendor)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id
      - name: credit_card_id
        description: "FK to SALES.CREDIT_CARD. Credit card associated with the record."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__credit_card')
                field: credit_card_id
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
