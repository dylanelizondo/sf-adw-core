version: 2

models:
  - name: brz_adventure_works_sales__sales_order_header_sales_reason
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SALES_ORDER_HEADER_SALES_REASON, exposed one to one
        with no transformations. Bridge between sales orders and the recorded reasons for the
        purchase. An order may carry several reasons. Grain: order + reason.
    config:
      # PRIMARY KEY over sales_order_id + sales_reason_id, applied as DDL after the
      # table is built. A `constraints:` block is only emitted when the model also
      # declares `contract: enforced: true`; without a contract dbt parses it and
      # ignores it, so the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on sales_order_id +
      # sales_reason_id -- those are what actually catch duplicates. What it does buy:
      # the optimizer can use it for join elimination, and BI tools and Snowflake
      # semantic views read it to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__sales_order_header_sales_reason PRIMARY KEY (sales_order_id, sales_reason_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__sales_order_header_sales_reason

            Bronze table over ADVENTURE_WORKS.SALES.SALES_ORDER_HEADER_SALES_REASON, exposed one to one with no transformations. Bridge between sales orders and the recorded reasons for the purchase. An order may carry several reasons. Grain: order + reason.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | SALES_ORDER_ID | FK to SALES.SALES_ORDER_HEADER. Sales order the record belongs to. |
            | SALES_REASON_ID | Part of the PK. FK to SALES.SALES_REASON. Reason for the purchase tied to the order. The parent column is named SALESREASONID in the source, so bronze exposes it unaliased and the two names do not match across the join. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [sales_order_id, sales_reason_id]

    columns:
      - name: sales_order_id
        description: "FK to SALES.SALES_ORDER_HEADER. Sales order the record belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_order_header')
                field: sales_order_id
      - name: sales_reason_id
        description: >
            Part of the PK. FK to SALES.SALES_REASON. Reason for the purchase tied to the order.
            The parent column is named SALESREASONID in the source, so bronze exposes it unaliased
            and the two names do not match across the join.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_reason')
                field: salesreasonid
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
