version: 2

models:
  - name: brz_adventure_works_sales__store
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.STORE. Reseller stores that buy from AdventureWorks,
        with the salesperson who serves them. The demographics XML is shredded into one column per field;
        every other column is exposed one to one with no transformations.
    config:
      # PRIMARY KEY over business_entity_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__store PRIMARY KEY (business_entity_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__store

            Bronze table over ADVENTURE_WORKS.SALES.STORE. Reseller stores that buy from AdventureWorks, with the salesperson who serves them. The demographics XML is shredded into one column per field; every other column is exposed one to one with no transformations.

            **Layer:** bronze
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | PK and FK to PERSON.BUSINESS_ENTITY. Identifies the store. |
            | DEMOGRAPHICS_ANNUAL_SALES | Annual sales reported by the store, in dollars. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_ANNUAL_REVENUE | Annual revenue reported by the store, in dollars. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_BANK_NAME | Name of the store's bank. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_BUSINESS_TYPE | Type of business, e.g. BM (Brick & Mortar), OS (Online Store), BR (Build and Repair). Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_YEAR_OPENED | Year the store first opened for business. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_SPECIALTY | Specialty area of the store, e.g. Mountain, Road, Touring. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_SQUARE_FEET | Floor space of the store, in square feet. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_BRAND_COUNT | Number of brands carried by the store. Arrives as text (e.g. "4+") and is never cast to a number. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_INTERNET_CONNECTION_TYPE | Type of Internet connection available at the store, e.g. DSL, T1, Cable. Shredded from the StoreSurvey demographics XML. |
            | DEMOGRAPHICS_NUMBER_EMPLOYEES | Number of employees working at the store. Shredded from the StoreSurvey demographics XML. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Name of the reseller store. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SALES_PERSON_ID | FK to SALES.SALES_PERSON. Salesperson who serves the store. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: business_entity_id
        description: "PK and FK to PERSON.BUSINESS_ENTITY. Identifies the store."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id
      - name: name
        description: "Name of the reseller store."
      - name: sales_person_id
        description: "FK to SALES.SALES_PERSON. Salesperson who serves the store."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_person')
                field: business_entity_id
      - name: demographics_annual_sales
        description: "Annual sales reported by the store, in dollars. Shredded from the StoreSurvey demographics XML."
      - name: demographics_annual_revenue
        description: "Annual revenue reported by the store, in dollars. Shredded from the StoreSurvey demographics XML."
      - name: demographics_bank_name
        description: "Name of the store's bank. Shredded from the StoreSurvey demographics XML."
      - name: demographics_business_type
        description: "Type of business, e.g. BM (Brick & Mortar), OS (Online Store), BR (Build and Repair). Shredded from the StoreSurvey demographics XML."
      - name: demographics_year_opened
        description: "Year the store first opened for business. Shredded from the StoreSurvey demographics XML."
      - name: demographics_specialty
        description: "Specialty area of the store, e.g. Mountain, Road, Touring. Shredded from the StoreSurvey demographics XML."
      - name: demographics_square_feet
        description: "Floor space of the store, in square feet. Shredded from the StoreSurvey demographics XML."
      - name: demographics_brand_count
        description: "Number of brands carried by the store. Arrives as text (e.g. \"4+\") and is never cast to a number. Shredded from the StoreSurvey demographics XML."
      - name: demographics_internet_connection_type
        description: "Type of Internet connection available at the store, e.g. DSL, T1, Cable. Shredded from the StoreSurvey demographics XML."
      - name: demographics_number_employees
        description: "Number of employees working at the store. Shredded from the StoreSurvey demographics XML."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
