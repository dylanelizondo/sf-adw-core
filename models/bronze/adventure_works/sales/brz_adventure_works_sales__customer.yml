version: 2

models:
  - name: brz_adventure_works_sales__customer
    description: >
        Bronze view over ADVENTURE_WORKS.SALES.CUSTOMER, exposed one to one with no transformations.
        Company customers. PERSON_ID identifies retail buyers and STORE_ID identifies reseller
        stores; the two are mutually exclusive.
    meta:
      atlan:
        attributes:
          ownerUsers: ["dylan.ea"]
          ownerGroups: ["it_adventure_works"]
          certificateStatus: DRAFT
          certificateStatusMessage: "Synced from dbt."
        domainName: "Sales"
        termNames:
          - "Sales"
        readme: |
          # brz_adventure_works_sales__customer

          Bronze view over ADVENTURE_WORKS.SALES.CUSTOMER, exposed one to one with no transformations. Company customers. PERSON_ID identifies retail buyers and STORE_ID identifies reseller stores; the two are mutually exclusive.

          **Layer:** bronze  
          **Subject area:** Sales

          | Column | Description |
          | --- | --- |
          | ACCOUNT_NUMBER | Customer account number, derived in the source system. |
          | CUSTOMER_ID | PK. Unique identifier of the customer. |
          | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
          | PERSON_ID | FK to PERSON.PERSON. Person buying at retail. Null when the customer is a store. |
          | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
          | STORE_ID | FK to SALES.STORE. Reseller store. Null when the customer is a person. |
          | TERRITORY_ID | FK to SALES.SALES_TERRITORY. Sales territory the record belongs to. |

          _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: customer_id
        description: "PK. Unique identifier of the customer."
        data_tests:
          - unique
          - not_null
      - name: person_id
        description: "FK to PERSON.PERSON. Person buying at retail. Null when the customer is a store."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__person')
                field: business_entity_id
      - name: store_id
        description: "FK to SALES.STORE. Reseller store. Null when the customer is a person."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__store')
                field: business_entity_id
      - name: territory_id
        description: "FK to SALES.SALES_TERRITORY. Sales territory the record belongs to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_territory')
                field: territory_id
      - name: account_number
        description: "Customer account number, derived in the source system."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
