version: 2

models:
  - name: brz_adventure_works_sales__sales_person
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SALES_PERSON, exposed one to one with no
        transformations. Salespeople with their quota, commission and accumulated performance.
        Extends HUMAN_RESOURCES.EMPLOYEE with sales specific attributes.
    config:
      # PRIMARY KEY over business_entity_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__sales_person PRIMARY KEY (business_entity_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__sales_person

            Bronze table over ADVENTURE_WORKS.SALES.SALES_PERSON, exposed one to one with no transformations. Salespeople with their quota, commission and accumulated performance. Extends HUMAN_RESOURCES.EMPLOYEE with sales specific attributes.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | BONUS | Additional bonus granted to the salesperson. |
            | BUSINESS_ENTITY_ID | PK and FK to HUMAN_RESOURCES.EMPLOYEE. Identifies the salesperson. |
            | COMMISSION_PCT | Commission percentage earned on sales. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SALES_LAST_YEAR | Sales accumulated over the previous year. |
            | SALES_QUOTA | Sales quota assigned to the salesperson. Null when no quota is set. |
            | SALES_YTD | Sales accumulated year to date. |
            | TERRITORY_ID | FK to SALES.SALES_TERRITORY. Assigned territory. Null for corporate salespeople. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: business_entity_id
        description: "PK and FK to HUMAN_RESOURCES.EMPLOYEE. Identifies the salesperson."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_human_resources__employee')
                field: business_entity_id
      - name: territory_id
        description: "FK to SALES.SALES_TERRITORY. Assigned territory. Null for corporate salespeople."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_sales__sales_territory')
                field: territory_id
      - name: sales_quota
        description: "Sales quota assigned to the salesperson. Null when no quota is set."
      - name: bonus
        description: "Additional bonus granted to the salesperson."
      - name: commission_pct
        description: "Commission percentage earned on sales."
      - name: sales_ytd
        description: "Sales accumulated year to date."
      - name: sales_last_year
        description: "Sales accumulated over the previous year."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
