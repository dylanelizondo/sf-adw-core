version: 2

models:
  - name: brz_adventure_works_sales__shopping_cart_item
    description: >
        Bronze table over ADVENTURE_WORKS.SALES.SHOPPING_CART_ITEM, exposed one to one with no
        transformations. Items sitting in online shopping carts that have not yet been turned into
        an order.
    config:
      # PRIMARY KEY over shopping_cart_item_id, applied as DDL after the table is
      # built. A `constraints:` block is only emitted when the model also declares
      # `contract: enforced: true`; without a contract dbt parses it and ignores it, so
      # the key would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on shopping_cart_item_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_sales__shopping_cart_item PRIMARY KEY (shopping_cart_item_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Sales"
          termNames:
            - "Sales"
          readme: |
            # brz_adventure_works_sales__shopping_cart_item

            Bronze table over ADVENTURE_WORKS.SALES.SHOPPING_CART_ITEM, exposed one to one with no transformations. Items sitting in online shopping carts that have not yet been turned into an order.

            **Layer:** bronze  
            **Subject area:** Sales

            | Column | Description |
            | --- | --- |
            | DATE_CREATED | Date the item was added to the cart. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | PRODUCT_ID | FK to PRODUCTION.PRODUCT. Product the record refers to. |
            | QUANTITY | Units of the product in the cart. |
            | SHOPPING_CART_ID | Identifier of the cart, tied to the user session. |
            | SHOPPING_CART_ITEM_ID | PK. Unique identifier of the cart item. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: shopping_cart_item_id
        description: "PK. Unique identifier of the cart item."
        data_tests:
          - unique
          - not_null
      - name: shopping_cart_id
        description: "Identifier of the cart, tied to the user session."
      - name: quantity
        description: "Units of the product in the cart."
      - name: product_id
        description: "FK to PRODUCTION.PRODUCT. Product the record refers to."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_production__product')
                field: product_id
      - name: date_created
        description: "Date the item was added to the cart."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
