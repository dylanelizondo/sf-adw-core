version: 2

models:
  - name: brz_adventure_works_human_resources__job_candidate
    description: >
        Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.JOB_CANDIDATE, exposed one to one with no
        transformations. Candidates for open positions, with their resume stored as XML.
        BUSINESS_ENTITY_ID is only populated once the candidate has been hired.
    config:
      # PRIMARY KEY over job_candidate_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on job_candidate_id -- those
      # are what actually catch duplicates. What it does buy: the optimizer can use it
      # for join elimination, and BI tools and Snowflake semantic views read it to
      # infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_human_resources__job_candidate PRIMARY KEY (job_candidate_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Human Resources"
          termNames:
            - "Human Resources"
          readme: |
            # brz_adventure_works_human_resources__job_candidate

            Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.JOB_CANDIDATE, exposed one to one with no transformations. Candidates for open positions, with their resume stored as XML. BUSINESS_ENTITY_ID is only populated once the candidate has been hired.

            **Layer:** bronze  
            **Subject area:** Human Resources

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | FK to HUMAN_RESOURCES.EMPLOYEE. Null while the candidate has not been hired. |
            | JOB_CANDIDATE_ID | PK. Unique identifier of the candidate. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | RESUME | Candidate resume as XML, exactly as delivered by the source. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: job_candidate_id
        description: "PK. Unique identifier of the candidate."
        data_tests:
          - unique
          - not_null
      - name: business_entity_id
        description: "FK to HUMAN_RESOURCES.EMPLOYEE. Null while the candidate has not been hired."
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_adventure_works_human_resources__employee')
                field: business_entity_id
      - name: resume
        description: "Candidate resume as XML, exactly as delivered by the source."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
