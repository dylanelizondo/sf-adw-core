version: 2

models:
  - name: brz_adventure_works_human_resources__shift
    description: >
        Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.SHIFT, exposed one to one with no
        transformations. Lookup of work shifts with their time window.
    config:
      # PRIMARY KEY over shift_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on shift_id -- those are what
      # actually catch duplicates. What it does buy: the optimizer can use it for join
      # elimination, and BI tools and Snowflake semantic views read it to infer the
      # fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_human_resources__shift PRIMARY KEY (shift_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Human Resources"
          termNames:
            - "Human Resources"
          readme: |
            # brz_adventure_works_human_resources__shift

            Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.SHIFT, exposed one to one with no transformations. Lookup of work shifts with their time window.

            **Layer:** bronze  
            **Subject area:** Human Resources

            | Column | Description |
            | --- | --- |
            | END_TIME | Time the shift ends. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NAME | Shift name (Day, Evening, Night). |
            | SHIFT_ID | PK. Unique identifier of the shift. |
            | START_TIME | Time the shift starts. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: shift_id
        description: "PK. Unique identifier of the shift."
        data_tests:
          - unique
          - not_null
      - name: name
        description: "Shift name (Day, Evening, Night)."
      - name: start_time
        description: "Time the shift starts."
      - name: end_time
        description: "Time the shift ends."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
