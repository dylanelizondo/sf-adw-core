version: 2

models:
  - name: brz_adventure_works_human_resources__employee
    description: >
        Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.EMPLOYEE, exposed one to one with no
        transformations. One row per employee with their employment and demographic attributes. The
        reporting hierarchy is modelled through ORGANIZATION_NODE / ORGANIZATION_LEVEL.
    config:
      # PRIMARY KEY over business_entity_id, applied as DDL after the table is built. A
      # `constraints:` block is only emitted when the model also declares `contract:
      # enforced: true`; without a contract dbt parses it and ignores it, so the key
      # would never reach Snowflake. This hook takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id --
      # those are what actually catch duplicates. What it does buy: the optimizer can
      # use it for join elimination, and BI tools and Snowflake semantic views read it
      # to infer the fact-to-dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_human_resources__employee PRIMARY KEY (business_entity_id)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Human Resources"
          termNames:
            - "Human Resources"
          readme: |
            # brz_adventure_works_human_resources__employee

            Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.EMPLOYEE, exposed one to one with no transformations. One row per employee with their employment and demographic attributes. The reporting hierarchy is modelled through ORGANIZATION_NODE / ORGANIZATION_LEVEL.

            **Layer:** bronze  
            **Subject area:** Human Resources

            | Column | Description |
            | --- | --- |
            | BIRTH_DATE | Employee date of birth. Sensitive data (PII). |
            | BUSINESS_ENTITY_ID | PK and FK to PERSON.BUSINESS_ENTITY. Identifies the employee. |
            | CURRENT_FLAG | 1 when the employee is active, 0 when no longer employed. |
            | GENDER | Gender recorded in the source system: M or F. |
            | HIRE_DATE | Date the employee was hired. |
            | JOB_TITLE | Current job title of the employee. |
            | LOGIN_ID | Network account the employee signs in with. |
            | MARITAL_STATUS | Marital status: M (married) or S (single). |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | NATIONAL_IDNUMBER | Employee national identification number. Sensitive data (PII). |
            | ORGANIZATION_LEVEL | Depth of the employee in the org chart. Null for the root level (CEO). |
            | ORGANIZATION_NODE | Hierarchical path of the employee in the org chart (source hierarchyid type). |
            | ROWGUID | Globally unique identifier (GUID) used by the source system for row-level replication. |
            | SALARIED_FLAG | 1 when the employee is salaried, 0 when paid hourly. |
            | SICK_LEAVE_HOURS | Sick leave hours available to the employee. |
            | VACATION_HOURS | Vacation hours available to the employee. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    columns:
      - name: business_entity_id
        description: "PK and FK to PERSON.BUSINESS_ENTITY. Identifies the employee."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_person__business_entity')
                field: business_entity_id
      - name: national_idnumber
        description: "Employee national identification number. Sensitive data (PII)."
      - name: login_id
        description: "Network account the employee signs in with."
      - name: organization_node
        description: "Hierarchical path of the employee in the org chart (source hierarchyid type)."
      - name: organization_level
        description: "Depth of the employee in the org chart. Null for the root level (CEO)."
      - name: job_title
        description: "Current job title of the employee."
      - name: birth_date
        description: "Employee date of birth. Sensitive data (PII)."
      - name: marital_status
        description: "Marital status: M (married) or S (single)."
      - name: gender
        description: "Gender recorded in the source system: M or F."
      - name: hire_date
        description: "Date the employee was hired."
      - name: salaried_flag
        description: "1 when the employee is salaried, 0 when paid hourly."
      - name: vacation_hours
        description: "Vacation hours available to the employee."
      - name: sick_leave_hours
        description: "Sick leave hours available to the employee."
      - name: current_flag
        description: "1 when the employee is active, 0 when no longer employed."
      - name: rowguid
        description: "Globally unique identifier (GUID) used by the source system for row-level replication."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
