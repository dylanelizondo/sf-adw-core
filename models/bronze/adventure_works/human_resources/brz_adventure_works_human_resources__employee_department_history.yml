version: 2

models:
  - name: brz_adventure_works_human_resources__employee_department_history
    description: >
        Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.EMPLOYEE_DEPARTMENT_HISTORY, exposed one to
        one with no transformations. History of employee assignments to department and shift. Grain:
        employee + department + shift + start date. Lets you rebuild headcount as of any date.
    config:
      # PRIMARY KEY over business_entity_id + department_id + shift_id + start_date,
      # applied as DDL after the table is built. A `constraints:` block is only emitted
      # when the model also declares `contract: enforced: true`; without a contract dbt
      # parses it and ignores it, so the key would never reach Snowflake. This hook
      # takes its place.
      #
      # Safe to re-run: the model is materialized as a table, so every run issues
      # CREATE OR REPLACE TABLE and the new table arrives with no constraints. If this
      # model is ever switched to incremental, the table survives between runs and the
      # second run will fail on a duplicate constraint name.
      #
      # Snowflake records the key as NOT ENFORCED and never validates it on write, so
      # it does not replace the unique and not_null tests on business_entity_id +
      # department_id + shift_id + start_date -- those are what actually catch
      # duplicates. What it does buy: the optimizer can use it for join elimination,
      # and BI tools and Snowflake semantic views read it to infer the fact-to-
      # dimension join.
      post_hook:
        - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_brz_adventure_works_human_resources__employee_department_history PRIMARY KEY (business_entity_id, department_id, shift_id, start_date)"

      meta:
        atlan:
          attributes:
            ownerUsers: ["dylan.ea"]
            ownerGroups: ["it_adventure_works"]
            certificateStatus: DRAFT
            certificateStatusMessage: "Synced from dbt."
          domainName: "Human Resources"
          termNames:
            - "Human Resources"
          readme: |
            # brz_adventure_works_human_resources__employee_department_history

            Bronze table over ADVENTURE_WORKS.HUMAN_RESOURCES.EMPLOYEE_DEPARTMENT_HISTORY, exposed one to one with no transformations. History of employee assignments to department and shift. Grain: employee + department + shift + start date. Lets you rebuild headcount as of any date.

            **Layer:** bronze  
            **Subject area:** Human Resources

            | Column | Description |
            | --- | --- |
            | BUSINESS_ENTITY_ID | Part of the PK and FK to HUMAN_RESOURCES.EMPLOYEE. Assigned employee. |
            | DEPARTMENT_ID | FK to HUMAN_RESOURCES.DEPARTMENT. Department the record belongs to. |
            | END_DATE | Date the employee left the department. Null for the current assignment. |
            | MODIFIED_DATE | Timestamp of the last change to the record in the source system. Arrives as text from the source. |
            | SHIFT_ID | FK to HUMAN_RESOURCES.SHIFT. Work shift the record belongs to. |
            | START_DATE | Date the employee joined the department. |

            _Synced automatically from dbt — edit the source .yml file in sf-adw-core, not this README._
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [business_entity_id, department_id, shift_id, start_date]

    columns:
      - name: business_entity_id
        description: "Part of the PK and FK to HUMAN_RESOURCES.EMPLOYEE. Assigned employee."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_human_resources__employee')
                field: business_entity_id
      - name: department_id
        description: "FK to HUMAN_RESOURCES.DEPARTMENT. Department the record belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_human_resources__department')
                field: department_id
      - name: shift_id
        description: "FK to HUMAN_RESOURCES.SHIFT. Work shift the record belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_adventure_works_human_resources__shift')
                field: shift_id
      - name: start_date
        description: "Date the employee joined the department."
        data_tests:
          - not_null
      - name: end_date
        description: "Date the employee left the department. Null for the current assignment."
      - name: modified_date
        description: "Timestamp of the last change to the record in the source system. Arrives as text from the source."
